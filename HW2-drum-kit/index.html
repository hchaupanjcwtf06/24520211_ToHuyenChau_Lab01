<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A browser-based drum kit with keyboard-accessible sound pads.">
  <title>Drum Kit Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script type="module">
    import { AudioEngine } from "./js/audio-engine.js";
    import { initializeKeyboard } from "./js/input-handler.js";
    import { BeatRecorder } from "./js/beat-recorder.js";

    const pads = document.querySelectorAll(".drum-pad");
  
    // Use each data-sound path as the sound identifier.
    const soundPaths = Object.fromEntries(
      Array.from(pads, (pad) => [
        pad.dataset.sound,
        pad.dataset.sound
      ])
    );
  
    const engine = new AudioEngine(soundPaths);
    const recorder = new BeatRecorder();

    const status = document.querySelector("#recorder-status");
    const recordButton = document.querySelector("#record-button");
    const stopButton = document.querySelector("#stop-button");
    const replayButton = document.querySelector("#replay-button");

    function activatePad(pad, { fromReplay = false } = {}) {
      engine.play(pad.dataset.sound);

      if (!fromReplay) {
        recorder.record(pad.dataset.key);
      }
    }
  
    initializeKeyboard({
      pads,
      activatePad
    });

    recordButton.addEventListener("click", () => {
  recorder.startRecording();
  status.textContent = "Recording...";
});

stopButton.addEventListener("click", () => {
  const recording = recorder.stopRecording();
  status.textContent = `Recording stopped. ${recording.length} beat(s) recorded.`;
});

    replayButton.addEventListener("click", () => {
      const recording = recorder.getRecording();

      if (recording.length === 0) {
        status.textContent = "No beats recorded yet.";
        return;
      }

      status.textContent = "Replaying...";

      recorder.replay((key) => {
        const pad = Array.from(pads).find(
          (item) => item.dataset.key.toLowerCase() === key
        );

        if (pad) {
          activatePad(pad, { fromReplay: true });
        }
      });
    });
  </script>

  <header class="page-header">
    <h1>Drum Kit</h1>
    <p>Choose a pad to play a drum sound.</p>
  </header>

  <main>
    <section class="drum-kit" aria-label="Drum sound pads">
      <button
        class="drum-pad"
        type="button"
        data-key="a"
        data-sound="assets/sounds/kick.wav"
        aria-label="Kick drum, keyboard key A"
      >
        <span class="pad-name">Kick</span>
        <span class="pad-key" aria-hidden="true">A</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="s"
        data-sound="assets/sounds/snare.wav"
        aria-label="Snare drum, keyboard key S"
      >
        <span class="pad-name">Snare</span>
        <span class="pad-key" aria-hidden="true">S</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="d"
        data-sound="assets/sounds/hihat.wav"
        aria-label="Hi-hat, keyboard key D"
      >
        <span class="pad-name">Hi-hat</span>
        <span class="pad-key" aria-hidden="true">D</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="f"
        data-sound="assets/sounds/tom.wav"
        aria-label="Tom drum, keyboard key F"
      >
        <span class="pad-name">Tom</span>
        <span class="pad-key" aria-hidden="true">F</span>
      </button>
    </section>

    
    <section class="recorder-controls" aria-label="Beat recorder controls">
      <button id="record-button" type="button">Record</button>
      <button id="stop-button" type="button">Stop</button>
      <button id="replay-button" type="button">Replay</button>
      <p id="recorder-status" role="status" aria-live="polite">
        Ready to record.
      </p>
    </section>

  </main>
</body>
</html>
