<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A browser-based drum kit with keyboard-accessible sound pads.">
  <title>Drum Kit Engine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="page-header">
    <h1>Drum Kit</h1>
    <p>Choose a pad to play a drum sound.</p>
  </header>

  <main>
    <section class="drum-kit" aria-label="Drum sound pads">
      <button
        class="drum-pad"
        type="button"
        data-key="a"
        data-sound="assets/sounds/kick.wav"
        aria-label="Kick drum, keyboard key A"
      >
        <span class="pad-name">Kick</span>
        <span class="pad-key" aria-hidden="true">A</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="s"
        data-sound="assets/sounds/snare.wav"
        aria-label="Snare drum, keyboard key S"
      >
        <span class="pad-name">Snare</span>
        <span class="pad-key" aria-hidden="true">S</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="d"
        data-sound="assets/sounds/hihat.wav"
        aria-label="Hi-hat, keyboard key D"
      >
        <span class="pad-name">Hi-hat</span>
        <span class="pad-key" aria-hidden="true">D</span>
      </button>

      <button
        class="drum-pad"
        type="button"
        data-key="f"
        data-sound="assets/sounds/tom.wav"
        aria-label="Tom drum, keyboard key F"
      >
        <span class="pad-name">Tom</span>
        <span class="pad-key" aria-hidden="true">F</span>
      </button>
    </section>
  </main>
</body>
</html>
