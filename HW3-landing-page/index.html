
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient Landing Page</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main>
    <section aria-labelledby="countdown-title">
      <h1 id="countdown-title">Something exciting is coming</h1>

      <div id="countdown" aria-live="off">
        <p>Time remaining: <span id="countdown-value">Loading...</span></p>
      </div>
    </section>
    
    <section aria-labelledby="signup-title">
        <h2 id="signup-title">Join the waiting list</h2>
    
        <form id="signup-form">
        <label for="name">Your name</label>
        <input
            id="name"
            name="name"
            type="text"
            maxlength="80"
            autocomplete="name"
            required
        >
    
        <label for="email">Email address</label>
        <input
            id="email"
            name="email"
            type="email"
            maxlength="254"
            autocomplete="email"
            required
        >
    
        <button id="submit-button" type="submit">Join now</button>
        <p id="form-status" role="status" aria-live="polite"></p>
        </form>
    </section>
  
  </main>
</body>
</html>
